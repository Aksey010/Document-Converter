  <!-- File type indicators -->
  <g font-size="10" fill="#ffffff" font-weight="bold" font-family="system-ui, sans-serif">
    <text x="30" y="78" text-anchor="middle">PDF</text>
    <text x="70" y="78" text-anchor="middle">DOCX</text>
  </g>
</svg>